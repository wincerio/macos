name: macOS Tahoe VNC Access

on:
  workflow_dispatch: {}

jobs:
  macos-vnc:
    # Стандартный лейбл macos-26 уже указывает на Apple Silicon раннер
    # (GitHub перевёл все актуальные macOS-образы на M-серию).
    runs-on: macos-26

    # Максимум для бесплатных раннеров — 6 часов (360 минут).
    # Оставляем запас, чтобы job успел красиво завершиться сам.
    timeout-minutes: 340

    steps:
      - name: Информация о раннере
        run: |
          sw_vers
          uname -a
          echo "Модель:"
          sysctl -n hw.model || true

      - name: Установка ngrok через Homebrew
        run: brew install ngrok/ngrok/ngrok

      - name: Настройка ngrok authtoken
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: ngrok config add-authtoken "$NGROK_AUTH_TOKEN"

      - name: Включение Screen Sharing (VNC) и установка пароля
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          # Включаем удалённое управление для всех пользователей
          sudo "$KICKSTART" -activate -configure -access -on \
            -restart -agent -privs -all

          # Включаем "устаревший" VNC-пароль (нужен обычным VNC-клиентам,
          # не только Apple Screen Sharing) и задаём его
          sudo "$KICKSTART" -configure -clientopts \
            -setvnclegacy -vnclegacy yes \
            -setvncpw -vncpw "$VNC_PASSWORD"

      - name: Запуск ngrok TCP-туннеля на порт 5900
        run: |
          nohup ngrok tcp 5900 --log=stdout > "$RUNNER_TEMP/ngrok.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ngrok.pid"
          sleep 8

      - name: Печать адреса для подключения
        run: |
          set +e
          echo "Ищу адрес туннеля..."
          ADDR=""
          for i in $(seq 1 20); do
            ADDR=$(curl -s http://127.0.0.1:4040/api/tunnels 2>/dev/null \
              | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    print(d['tunnels'][0]['public_url'])
except Exception:
    pass
" 2>/dev/null)
            if [ -n "$ADDR" ]; then
              CLEAN=${ADDR#tcp://}
              echo "=================================================="
              echo " Подключайтесь VNC-клиентом на:  $CLEAN"
              echo " (пароль — тот, что вы задали в secret VNC_PASSWORD)"
              echo "=================================================="
              break
            fi
            echo "Попытка $i: туннель ещё не поднялся, жду..."
            sleep 3
          done
          set -e
          if [ -z "$ADDR" ]; then
            echo "Не удалось получить адрес туннеля, смотрите лог ngrok ниже:"
            cat "$RUNNER_TEMP/ngrok.log" 2>/dev/null || true
            exit 1
          fi

      - name: Удерживаем сессию открытой
        run: |
          echo "Сессия активна. Job завершится сам через ~5.5 часов."
          echo "Чтобы закончить раньше — отмените запуск вручную во вкладке Actions."
          sleep 19800
